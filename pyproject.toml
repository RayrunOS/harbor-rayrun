[project]
name = "harbor-rayrun"
version = "0.1.2"
description = "Harbor provider：把 Rayrun 沙箱云接成 Harbor 的评测环境"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
# 依赖只有两个：Harbor 本体（提供 BaseEnvironment 抽象面）与 httpx（打 Rayrun 的
# HTTP API）。钉在 0.26 系列：0.26 要求自定义环境的 preflight 接受 kwargs。
# 刻意不引 Rayrun 的生成式 SDK —— provider 只用少量端点，薄客户端足够。
dependencies = [
    "harbor>=0.26,<0.27",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.urls]
Homepage = "https://github.com/RayrunOS/harbor-rayrun"
Repository = "https://github.com/RayrunOS/harbor-rayrun"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harbor_rayrun"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
